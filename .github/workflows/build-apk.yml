name: Build MiPlay Manager APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          cd $HOME/Android/Sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH=$HOME/Android/Sdk/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          cd $GITHUB_WORKSPACE
          echo "sdk.dir=$HOME/Android/Sdk" > local.properties
          cat local.properties

      - name: 授权 Gradle
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: miplay-manager-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号：$VERSION"

      - name: 创建 Release 并上传 APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: 妙播管理器 v${{ steps.version.outputs.version }}（构建 #${{ github.run_number }}）
          body: |
            妙播管理器 Android App v${{ steps.version.outputs.version }}
            
            功能：
            - 状态显示（来源/妙播/DLNA/播放/声卡）
            - 音量控制（0-15，实时写入）
            - 播放控制（播放/暂停/停止/上下首）
            - 连接管理（清除妙播/DLNA/全部停止）
            - 服务器地址修改（家里 Wi-Fi / Tailscale 外出）
            - 测试声卡
            
            服务器：
            - 家里：192.168.1.10:8092
            - 外出：100.88.1.6:8092（需开 Tailscale）
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
